name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CekSaldo.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CekSaldo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CekSaldo-apk
          path: dist/*.apk

      # Setiap push ke main memperbarui rilis "latest" agar APK terbaru selalu bisa diunduh.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --title "CekSaldo (build terbaru)" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. Unduh CekSaldo.apk lalu pasang di Android." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "CekSaldo $GITHUB_REF_NAME" --generate-notes
