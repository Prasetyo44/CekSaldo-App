name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log; then
            # Tampilkan error kompilasi/tes sebagai anotasi agar terlihat di halaman Actions.
            msg=$( (grep -E "^e: |FAILED|AssertionError|Expected|What went wrong" -A3 build.log || tail -40 build.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build gagal::$msg"
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CekSaldo.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CekSaldo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CekSaldo-apk
          path: dist/*.apk

      # Setiap push ke main memperbarui rilis "latest" agar APK terbaru selalu bisa diunduh.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --title "CekSaldo (build terbaru)" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. Unduh CekSaldo.apk lalu pasang di Android." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "CekSaldo $GITHUB_REF_NAME" --generate-notes

  # Menjalankan aplikasi di emulator Android: tes alur utama (debug) dan uji buka APK release.
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease assembleDebugAndroidTest 2>&1 | tee build.log; then
            msg=$( (grep -E "^e: |What went wrong" -A3 build.log || tail -40 build.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build tes gagal::$msg"
            exit 1
          fi

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/emulator-test.sh
